overview: "Génère des sous-titres traduits par IA (Mistral) pour les médias de la bibliothèque"
description: >
  Scanne les sous-titres existants de la bibliothèque Jellyfin et, lorsqu'un média
  en possède, génère via l'API Mistral des sous-titres traduits dans une ou plusieurs
  langues choisies. Les fichiers générés sont déposés à côté du média et nommés
  "<langue>-AI". Le scan automatique porte sur les 10 derniers médias ajoutés.
